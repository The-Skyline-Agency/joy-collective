<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 60" width="720" height="120">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=Manrope:wght@500&amp;display=swap');
    .joy{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:40px;fill:#1A1817}
    .col{font-family:Manrope,Arial,sans-serif;font-weight:500;font-size:12px;letter-spacing:5px;fill:#1A1817}
  </style>
  <!-- Mark: circle (the collective) + spark (a little moment of joy) -->
