  </g>
  <text class="joy" x="70" y="43">Joy</text>
  <line x1="137" y1="16" x2="137" y2="46" stroke="#1A1817" stroke-opacity=".18"/>
  <text class="col" x="152" y="35">COLLECTIVE</text>
</svg>
